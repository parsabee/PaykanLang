# The PaykanLang documentation site, https://parsabee.github.io/PaykanLang/
#
# GitHub Pages builds it from this directory with its own Jekyll (the
# actions/jekyll-build-pages action, see .github/workflows/pages.yml), so the
# repository holds no Gemfile or other site dependency.  The theme is fetched
# by GitHub at build time (jekyll-remote-theme), and every plugin below is one
# GitHub Pages ships.
#
# The Markdown files stay plain GitHub Markdown, without front matter: the
# navigation (title, parent, order) of each page is set under `defaults`
# below.  A new page shows up in the sidebar once it gets an entry there.

title: PaykanLang
description: >-
  A statically typed language with classes, generics and automatic reference
  counting that compiles to native code.
url: https://parsabee.github.io
baseurl: /PaykanLang
repository: parsabee/PaykanLang

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links

# `[text](other.md#anchor)` links work on GitHub and on the site.
relative_links:
  enabled: true
  collections: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
aux_links:
  PaykanLang on GitHub: https://github.com/parsabee/PaykanLang
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/parsabee/PaykanLang
gh_edit_branch: develop
gh_edit_source: docs
gh_edit_view_mode: tree
footer_content: >-
  PaykanLang is released under the
  <a href="https://github.com/parsabee/PaykanLang/blob/develop/LICENSE">MIT License</a>.

