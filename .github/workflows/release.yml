name: Release

# Triggered by pushing a version tag (e.g. v1.2.3). Builds Release binaries on
# every supported platform, stages them with `cmake --install`, packages each
# staged tree into a tarball, builds a Debian/Ubuntu package (.deb, Linux) with
# CPack, and publishes a GitHub Release with the tarballs and the .deb (and
# their SHA-256 sums) attached.
#
# It can also be run by hand (Actions tab -> Release -> "Run workflow").  A
# manual run is a dry run by default: it builds, smoke-tests and packages every
# platform and uploads the tarballs as workflow artifacts, but publishes no
# GitHub Release.  Unticking dry_run publishes, and only when the run's ref is
# a tag.
#
# A tag with a pre-release suffix (v1.2.3-rc1, v1.2.3-beta: any '-') is
# published as a GitHub pre-release and never marked "Latest" (#133); a plain
# version tag (v1.2.3) is a normal release and becomes "Latest".  The "Release
# plan" job prints that decision on every run, dry runs included.
#
# A normal release then feeds the package channels, which live in their own
# repositories, parsabee/homebrew-paykanlang and parsabee/paykanlang-apt: it
# opens a pull request on the Homebrew tap that points the formula at the
# release's tarballs, and sends
# the apt repository the dispatch that re-indexes and signs it.  Both need the
# RELEASE_CHANNELS_TOKEN secret, a fine-grained token with Contents and Pull
# requests write access on both repositories; without it the release is
# published and the channels are skipped with a warning.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, smoke-test and package, but publish no GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-14
            generator: "Unix Makefiles"
          - label: linux-x86_64
            runner: ubuntu-latest
            generator: "Ninja"
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            generator: "Ninja"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # dpkg-dev: dpkg-shlibdeps, which cpack runs for the .deb's Depends.
        # libzstd-dev: the prebuilt LLVM links with zstd (linked statically).
        run: sudo apt-get update && sudo apt-get install -y ninja-build dpkg-dev libzstd-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew list zstd > /dev/null 2>&1 || brew install zstd

      # Only paykan and the runtime are shipped: no test suite, so no GoogleTest.
      # The release ships the defaults: the recursive-descent frontend and the
      # mlir backend (the ORC JIT for `run`, native objects for `build`, and
      # --emit-c).  LLVM is downloaded at configure time
      # (cmake/LLVMSetup.cmake) and linked statically into paykan, so the
      # installed paykan needs no LLVM, only a C compiler to link `build`'s
      # executables.
      - name: Configure (Release, the defaults)
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G "${{ matrix.generator }}"
          -DPAYKAN_BUILD_TESTS=OFF -DPAYKAN_RELEASE=ON

      # paykan_stdlib compiles stdlib/ with the built paykan and stages it
      # where paykan finds it (and where `cmake --install` takes it from).
      - name: Build
        run: cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)" --target paykan paykan_runtime paykan_stdlib

      # Sanity-check the release binary actually runs before we publish it.
      - name: Smoke test (--version, run, build and --emit-c)
        run: |
          set -euo pipefail
          ./build/bin/paykan --version
          ./build/bin/paykan --list-backends | grep '^mlir (default)'
          printf 'import ::io;\nfn main() -> int {\n  io::println("Hello from release CI!");\n  return 0;\n}\n' > /tmp/hello.pkn
          ./build/bin/paykan /tmp/hello.pkn | grep -Fx "Hello from release CI!"
          ./build/bin/paykan -o /tmp/hello build /tmp/hello.pkn
          /tmp/hello | grep -Fx "Hello from release CI!"
          ./build/bin/paykan --emit-c /tmp/hello.pkn | grep -F 'int main('

      # The tag must name the version the tree builds: CMakeLists.txt
      # (project() VERSION plus PAYKAN_VERSION_PRERELEASE) is the only place
      # that spells it, so it is read back from the built paykan, never
      # written here.  A tag vX.Y.Z on a tree that builds anything but X.Y.Z
      # fails before anything is packaged or published.
      - name: Check the tag matches the built version
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          built="$(./build/bin/paykan --version | sed -n '1s/^PaykanLang //p')"
          if [ "v${built}" != "${REF_NAME}" ]; then
            echo "error: tag ${REF_NAME} does not match the built version ${built:-<none>} (paykan --version)"
            exit 1
          fi
          echo "tag ${REF_NAME} matches PaykanLang ${built}"

      - name: Stage install tree
        run: cmake --install build --prefix "stage/paykanlang"

      - name: Package tarball
        id: package
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual run on a branch: name the tarballs after the commit.
            VERSION="dryrun-${GITHUB_SHA::7}"
          fi
          ARCHIVE="paykanlang-${VERSION}-${{ matrix.label }}.tar.gz"
          tar -C stage -czf "${ARCHIVE}" paykanlang
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"

      # The Debian/Ubuntu package (cmake/Packaging.cmake), from the same
      # Release build: paykanlang_<version>_<arch>.deb, installing under /usr.
      - name: Build the Debian package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          (cd build && cpack -G DEB)
          mv build/paykanlang_*.deb .
          for deb in paykanlang_*.deb; do
            dpkg-deb --info "${deb}"
            dpkg-deb --contents "${deb}"
            shasum -a 256 "${deb}" > "${deb}.sha256"
          done

      # Install the package system-wide and use it as a user would: the
      # installed /usr/bin/paykan runs and builds a program with the system C
      # compiler, and a backend plugin built against the /usr installation
      # (find_package(Paykan)) loads into it.
      - name: Smoke test the Debian package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          debs=(paykanlang_*.deb)
          sudo apt-get install -y "./${debs[0]}"
          work="$(mktemp -d)"
          cd "${work}"
          test "$(command -v paykan)" = /usr/bin/paykan
          paykan --version
          printf 'import ::io;\nfn main() -> int {\n  io::println("Hello from the .deb!");\n  return 0;\n}\n' > hello.pkn
          paykan run hello.pkn | grep -Fx "Hello from the .deb!"
          paykan build -o hello hello.pkn
          ./hello | grep -Fx "Hello from the .deb!"
          cmake -S "${GITHUB_WORKSPACE}/src/Backends/PrintPIR" -B print-pir -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build print-pir
          paykan --plugin=print-pir/libpaykan_backend_print_pir.so --list-backends | grep '^print-pir'
          paykan --plugin=print-pir/libpaykan_backend_print_pir.so --backend=print-pir --emit-source hello.pkn | grep -F 'Hello from the .deb!'
          sudo apt-get purge -y paykanlang

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          # The .deb only exists on Linux; a missing pattern is not an error.
          path: |
            paykanlang-*.tar.gz
            paykanlang-*.tar.gz.sha256
            paykanlang_*.deb
            paykanlang_*.deb.sha256

  # How the release is (or, in a dry run, would be) published: the same
  # expressions the "Create GitHub Release" step passes to
  # softprops/action-gh-release, shown in the run's summary.
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    steps:
      - name: Show how the release is published
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
          MAKE_LATEST: ${{ !contains(github.ref_name, '-') }}
          PUBLISH: ${{ github.event_name == 'push' || (!inputs.dry_run && github.ref_type == 'tag') }}
        run: |
          set -euo pipefail
          {
            echo "### Release plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ref | \`${REF_NAME}\` (${REF_TYPE}) |"
            echo "| publishes a GitHub Release | ${PUBLISH} |"
            echo "| prerelease | ${PRERELEASE} |"
            echo "| make_latest | ${MAKE_LATEST} |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          # A pre-release suffix and "Latest" are mutually exclusive.
          if [ "${PRERELEASE}" = "${MAKE_LATEST}" ]; then
            echo "error: prerelease and make_latest must differ"
            exit 1
          fi

  release:
    name: Publish GitHub Release
    needs: [build, plan]
    # Tag pushes always publish; manual runs only when dry_run is unticked and
    # the run's ref is a tag.
    if: github.event_name == 'push' || (!inputs.dry_run && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PaykanLang ${{ github.ref_name }}
          # v1.2.3-rc1, v1.2.3-beta, ...: a pre-release, never "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/paykanlang-*.tar.gz
            dist/paykanlang-*.tar.gz.sha256
            dist/paykanlang_*.deb
            dist/paykanlang_*.deb.sha256

  channels:
    name: Update the package channels
    needs: release
    # Pre-releases stay on the release pages.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      TAP_REPO: parsabee/homebrew-paykanlang
      APT_REPO: parsabee/paykanlang-apt
      # A fine-grained token with contents and pull-requests write access on
      # both repositories; GITHUB_TOKEN cannot write to another repository.
      GH_TOKEN: ${{ secrets.RELEASE_CHANNELS_TOKEN }}
    steps:
      - name: Check for the channels token
        id: token
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::RELEASE_CHANNELS_TOKEN is not set: ${TAP_REPO} and ${APT_REPO} are not updated"
            echo "set=false" >> "${GITHUB_OUTPUT}"
          else
            echo "set=true" >> "${GITHUB_OUTPUT}"
          fi

      # The formula installs the release's prebuilt tarballs (paykan links
      # LLVM statically, so a source build would download and link LLVM on
      # the user's machine): each platform's url and sha256 change, read
      # from the tarball and the .sha256 the release just published.  The
      # tap's CI installs and tests the formula on the pull request.
      - name: Open the Homebrew tap's bump pull request
        if: steps.token.outputs.set == 'true'
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap
          branch="paykanlang-${version}"
          git checkout -b "${branch}"
          # Each platform's url lines name its tarball (paykanlang-<version>-
          # <label>.tar.gz), each followed by its sha256 line; the macOS one
          # is there twice, for Apple Silicon and for Intel (which the
          # formula refuses, but brew wants a URL on every macOS).
          for label in macos-arm64 linux-x86_64 linux-arm64; do
            archive="paykanlang-${version}-${label}.tar.gz"
            sha="$(curl -fsSL "${base}/${archive}.sha256" | cut -d' ' -f1)"
            test "${#sha}" -eq 64
            URL="${base}/${archive}" SHA="${sha}" LABEL="${label}" perl -0pi -e '
              s{^(\s*)url "[^"]*-\Q$ENV{LABEL}\E\.tar\.gz"\n(\s*)sha256 "[0-9a-f]*"$}
               {$1url "$ENV{URL}"\n$2sha256 "$ENV{SHA}"}mg
                or die "no url line for $ENV{LABEL} in the formula\n"' Formula/paykanlang.rb
          done
          if git diff --quiet; then
            echo "::notice::the formula already installs ${TAG}"
            exit 0
          fi
          git diff
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "paykanlang ${version}"
          git push origin "${branch}"
          gh pr create --repo "${TAP_REPO}" --base main --head "${branch}" \
            --title "paykanlang ${version}" \
            --body "Points the formula at the [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}) tarballs. Merge once \`brew test-bot\` passes."

      - name: Ask the apt repository to publish
        if: steps.token.outputs.set == 'true'
        run: |
          gh api "repos/${APT_REPO}/dispatches" \
            -f event_type=paykanlang-release -f "client_payload[tag]=${TAG}"
