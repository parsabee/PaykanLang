name: Release

# Triggered by pushing a version tag (e.g. v1.2.3). Builds Release binaries on
# every supported platform, stages them with `cmake --install`, packages each
# staged tree into a tarball, builds a Debian/Ubuntu package (.deb, Linux) with
# CPack, and publishes a GitHub Release with the tarballs and the .deb (and
# their SHA-256 sums) attached.
#
# It can also be run by hand (Actions tab -> Release -> "Run workflow").  A
# manual run is a dry run by default: it builds, smoke-tests and packages every
# platform and uploads the tarballs as workflow artifacts, but publishes no
# GitHub Release.  Unticking dry_run publishes, and only when the run's ref is
# a tag.
#
# A tag with a pre-release suffix (v1.2.3-rc1, v1.2.3-beta: any '-') is
# published as a GitHub pre-release and never marked "Latest" (#133); a plain
# version tag (v1.2.3) is a normal release and becomes "Latest".  The "Release
# plan" job prints that decision on every run, dry runs included.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, smoke-test and package, but publish no GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write   # required to create the GitHub Release
  actions: write    # re-runs the Pages workflow, which publishes the apt repository

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-14
            generator: "Unix Makefiles"
          - label: linux-x86_64
            runner: ubuntu-latest
            generator: "Ninja"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # dpkg-dev: dpkg-shlibdeps, which cpack runs for the .deb's Depends.
        run: sudo apt-get update && sudo apt-get install -y ninja-build dpkg-dev

      # Only paykan and the runtime are shipped: no test suite, so no GoogleTest.
      # The release ships the recursive-descent frontend and both backends:
      # c (the default, which needs only a C compiler at run time) and llvm
      # (--backend=llvm: the ORC JIT for `run`, native objects for `build`).
      # LLVM is downloaded at configure time (cmake/LLVMSetup.cmake) and
      # linked statically into paykan, so the installed paykan needs no LLVM.
      - name: Configure (Release, recursive-descent + c + llvm)
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G "${{ matrix.generator }}"
          -DPAYKAN_BUILD_TESTS=OFF
          -DPAYKAN_FRONTENDS=recursive-descent "-DPAYKAN_BACKENDS=llvm;c"

      - name: Build
        run: cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)" --target paykan paykan_runtime

      # Sanity-check the release binary actually runs before we publish it.
      - name: Smoke test (--version + run and build on both backends)
        run: |
          set -euo pipefail
          ./build/bin/paykan --version
          ./build/bin/paykan --list-backends | grep '^c (default)'
          ./build/bin/paykan --list-backends | grep '^llvm'
          printf 'fn main() -> int {\n  println("Hello from release CI!");\n  return 0;\n}\n' > /tmp/hello.pkn
          for be in c llvm; do
            ./build/bin/paykan --backend="${be}" /tmp/hello.pkn | grep -Fx "Hello from release CI!"
            ./build/bin/paykan --backend="${be}" -o "/tmp/hello-${be}" build /tmp/hello.pkn
            "/tmp/hello-${be}" | grep -Fx "Hello from release CI!"
          done

      # The tag must name the version the tree builds: CMakeLists.txt
      # (project() VERSION plus PAYKAN_VERSION_PRERELEASE) is the only place
      # that spells it, so it is read back from the built paykan, never
      # written here.  A tag vX.Y.Z on a tree that builds anything but X.Y.Z
      # fails before anything is packaged or published.
      - name: Check the tag matches the built version
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          built="$(./build/bin/paykan --version | sed -n '1s/^PaykanLang //p')"
          if [ "v${built}" != "${REF_NAME}" ]; then
            echo "error: tag ${REF_NAME} does not match the built version ${built:-<none>} (paykan --version)"
            exit 1
          fi
          echo "tag ${REF_NAME} matches PaykanLang ${built}"

      - name: Stage install tree
        run: cmake --install build --prefix "stage/paykanlang"

      - name: Package tarball
        id: package
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual run on a branch: name the tarballs after the commit.
            VERSION="dryrun-${GITHUB_SHA::7}"
          fi
          ARCHIVE="paykanlang-${VERSION}-${{ matrix.label }}.tar.gz"
          tar -C stage -czf "${ARCHIVE}" paykanlang
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"

      # The Debian/Ubuntu package (cmake/Packaging.cmake), from the same
      # Release build: paykanlang_<version>_<arch>.deb, installing under /usr.
      - name: Build the Debian package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          (cd build && cpack -G DEB)
          mv build/paykanlang_*.deb .
          for deb in paykanlang_*.deb; do
            dpkg-deb --info "${deb}"
            dpkg-deb --contents "${deb}"
            shasum -a 256 "${deb}" > "${deb}.sha256"
          done

      # Install the package system-wide and use it as a user would: the
      # installed /usr/bin/paykan runs and builds a program with the system C
      # compiler, and a backend plugin built against the /usr installation
      # (find_package(Paykan)) loads into it.
      - name: Smoke test the Debian package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          debs=(paykanlang_*.deb)
          sudo apt-get install -y "./${debs[0]}"
          work="$(mktemp -d)"
          cd "${work}"
          test "$(command -v paykan)" = /usr/bin/paykan
          paykan --version
          printf 'fn main() -> int {\n  println("Hello from the .deb!");\n  return 0;\n}\n' > hello.pkn
          for be in c llvm; do
            paykan --backend="${be}" run hello.pkn | grep -Fx "Hello from the .deb!"
            paykan --backend="${be}" build -o "hello-${be}" hello.pkn
            "./hello-${be}" | grep -Fx "Hello from the .deb!"
          done
          cmake -S "${GITHUB_WORKSPACE}/src/Backends/PrintPIR" -B print-pir -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build print-pir
          paykan --plugin=print-pir/libpaykan_backend_print_pir.so --list-backends | grep '^print-pir'
          paykan --plugin=print-pir/libpaykan_backend_print_pir.so --backend=print-pir --emit-source hello.pkn | grep -F 'Hello from the .deb!'
          sudo apt-get purge -y paykanlang

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          # The .deb only exists on Linux; a missing pattern is not an error.
          path: |
            paykanlang-*.tar.gz
            paykanlang-*.tar.gz.sha256
            paykanlang_*.deb
            paykanlang_*.deb.sha256

  # How the release is (or, in a dry run, would be) published: the same
  # expressions the "Create GitHub Release" step passes to
  # softprops/action-gh-release, shown in the run's summary.
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    steps:
      - name: Show how the release is published
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
          MAKE_LATEST: ${{ !contains(github.ref_name, '-') }}
          PUBLISH: ${{ github.event_name == 'push' || (!inputs.dry_run && github.ref_type == 'tag') }}
        run: |
          set -euo pipefail
          {
            echo "### Release plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ref | \`${REF_NAME}\` (${REF_TYPE}) |"
            echo "| publishes a GitHub Release | ${PUBLISH} |"
            echo "| prerelease | ${PRERELEASE} |"
            echo "| make_latest | ${MAKE_LATEST} |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          # A pre-release suffix and "Latest" are mutually exclusive.
          if [ "${PRERELEASE}" = "${MAKE_LATEST}" ]; then
            echo "error: prerelease and make_latest must differ"
            exit 1
          fi

  release:
    name: Publish GitHub Release
    needs: [build, plan]
    # Tag pushes always publish; manual runs only when dry_run is unticked and
    # the run's ref is a tag.
    if: github.event_name == 'push' || (!inputs.dry_run && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PaykanLang ${{ github.ref_name }}
          # v1.2.3-rc1, v1.2.3-beta, ...: a pre-release, never "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/paykanlang-*.tar.gz
            dist/paykanlang-*.tar.gz.sha256
            dist/paykanlang_*.deb
            dist/paykanlang_*.deb.sha256

      # Rebuild the documentation site, which carries the apt repository, so
      # the new .deb reaches `apt install paykanlang` (a release published
      # with this token does not trigger other workflows by itself).
      - name: Refresh the apt repository
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${GITHUB_REPOSITORY}" --ref develop
