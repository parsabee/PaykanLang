name: Release

# Triggered by pushing a version tag (e.g. v0.1.0-alpha). Builds Release binaries on
# every supported platform, stages them with `cmake --install`, packages each
# staged tree into a tarball, and publishes a GitHub Release with the tarballs
# (and their SHA-256 sums) attached.
#
# It can also be run by hand (Actions tab -> Release -> "Run workflow").  A
# manual run is a dry run by default: it builds, smoke-tests and packages every
# platform and uploads the tarballs as workflow artifacts, but publishes no
# GitHub Release.  Unticking dry_run publishes, and only when the run's ref is
# a tag.
#
# A tag with a pre-release suffix (v0.1.0-alpha, v1.2.0-rc1: any '-') is
# published as a GitHub pre-release and never marked "Latest" (#133); a plain
# version tag (v0.1.0) is a normal release and becomes "Latest".  The "Release
# plan" job prints that decision on every run, dry runs included.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, smoke-test and package, but publish no GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-14
            generator: "Unix Makefiles"
          - label: linux-x86_64
            runner: ubuntu-latest
            generator: "Ninja"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Only paykan and the runtime are shipped: no test suite, so no GoogleTest.
      # The release ships the core (#27, #123): the recursive-descent frontend
      # and the c backend, which need only a C compiler at run time.  The
      # opt-in LLVM backend is not in the tarballs.  The lists are the
      # defaults, spelled out so the shipped configuration stays explicit.
      - name: Configure (Release, core)
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G "${{ matrix.generator }}"
          -DPAYKAN_BUILD_TESTS=OFF
          -DPAYKAN_FRONTENDS=recursive-descent -DPAYKAN_BACKENDS=c

      - name: Build
        run: cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)" --target paykan paykan_runtime

      # Sanity-check the release binary actually runs before we publish it.
      - name: Smoke test (--version + C-backend run and build)
        run: |
          set -euo pipefail
          ./build/bin/paykan --version
          ./build/bin/paykan --list-backends | grep '^c (default)'
          printf 'fn main() -> int {\n  println("Hello from release CI!");\n  return 0;\n}\n' > /tmp/hello.pkn
          ./build/bin/paykan /tmp/hello.pkn | grep -Fx "Hello from release CI!"
          ./build/bin/paykan -o /tmp/hello build /tmp/hello.pkn
          /tmp/hello | grep -Fx "Hello from release CI!"

      - name: Stage install tree
        run: cmake --install build --prefix "stage/paykanlang"

      - name: Package tarball
        id: package
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual run on a branch: name the tarballs after the commit.
            VERSION="dryrun-${GITHUB_SHA::7}"
          fi
          ARCHIVE="paykanlang-${VERSION}-${{ matrix.label }}.tar.gz"
          tar -C stage -czf "${ARCHIVE}" paykanlang
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            paykanlang-*.tar.gz
            paykanlang-*.tar.gz.sha256

  # How the release is (or, in a dry run, would be) published: the same
  # expressions the "Create GitHub Release" step passes to
  # softprops/action-gh-release, shown in the run's summary.
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    steps:
      - name: Show how the release is published
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
          MAKE_LATEST: ${{ !contains(github.ref_name, '-') }}
          PUBLISH: ${{ github.event_name == 'push' || (!inputs.dry_run && github.ref_type == 'tag') }}
        run: |
          set -euo pipefail
          {
            echo "### Release plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ref | \`${REF_NAME}\` (${REF_TYPE}) |"
            echo "| publishes a GitHub Release | ${PUBLISH} |"
            echo "| prerelease | ${PRERELEASE} |"
            echo "| make_latest | ${MAKE_LATEST} |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          # A pre-release suffix and "Latest" are mutually exclusive.
          if [ "${PRERELEASE}" = "${MAKE_LATEST}" ]; then
            echo "error: prerelease and make_latest must differ"
            exit 1
          fi

  release:
    name: Publish GitHub Release
    needs: [build, plan]
    # Tag pushes always publish; manual runs only when dry_run is unticked and
    # the run's ref is a tag.
    if: github.event_name == 'push' || (!inputs.dry_run && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PaykanLang ${{ github.ref_name }}
          # v0.1.0-alpha, v1.2.0-rc1, ...: a pre-release, never "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/paykanlang-*.tar.gz
            dist/paykanlang-*.tar.gz.sha256
