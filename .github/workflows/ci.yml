name: CI

on:
  push:
    branches: [main, develop]
  # Every pull request, whatever its base: stacked PRs (based on another
  # PR's branch) need CI too.
  pull_request:
  # Manual runs on any branch (Actions tab -> CI -> "Run workflow").
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older runs: their
# results no longer matter, and they would hold the scarce macOS runners.
# Pushes to a branch (develop) each run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job builds the default configuration: the recursive-descent frontend
# and the mlir backend, the only in-tree one (#123), whose LLVM 22 with MLIR
# the configure downloads once into build/third-party (cached per job kind).
#
# A pull request builds and runs only the test suites its changes can affect
# (scripts/affected_tests.py, the "changes" job); a push builds them all.
# Every job passes the result to CMake as $PAYKAN_TESTS_FLAG, one argument:
# -DPAYKAN_BUILD_TESTS=<suites> or -DPAYKAN_BUILD_ALL_TESTS=ON.
jobs:
  changes:
    name: Affected test suites
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.affected.outputs.tests }}
      cmake-flag: ${{ steps.affected.outputs.cmake-flag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the test suites
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "pull_request" ]; then
            git diff --name-only "${BASE_SHA}" HEAD
            tests="$(python3 scripts/affected_tests.py --base "${BASE_SHA}")"
          else
            tests=all
          fi
          if [ "${tests}" = "all" ]; then
            flag="-DPAYKAN_BUILD_ALL_TESTS=ON"
          else
            flag="-DPAYKAN_BUILD_TESTS=${tests}"
          fi
          echo "tests=${tests}" >> "${GITHUB_OUTPUT}"
          echo "cmake-flag=${flag}" >> "${GITHUB_OUTPUT}"
          echo "### Test suites: \`${tests:-none}\`" >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # Code quality gate: clang-format (check) + clang-tidy (bug-focused).
  # Uses the vendored LLVM toolchain so the gate matches local runs exactly.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint | clang-format + clang-tidy + actionlint
    runs-on: macos-14
    needs: changes
    env:
      PAYKAN_TESTS_FLAG: ${{ needs.changes.outputs.cmake-flag }}
    steps:
      - uses: actions/checkout@v4

      # The workflows themselves (#133): every actionlint finding fails the
      # job, including shellcheck's on `run:` scripts -- e.g. SC2251, a
      # `! cmd` check that bash -e silently ignores.  actionlint skips the
      # shellcheck pass when shellcheck is missing, so require it.
      - name: actionlint (workflows, with shellcheck)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          command -v shellcheck || brew install shellcheck
          shellcheck --version
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/actionlint" -version
          "${RUNNER_TEMP}/actionlint" -color -shellcheck "$(command -v shellcheck)"

      # The prebuilt LLVM links with zstd (cmake/LLVMSetup.cmake).
      - name: Install system dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew list zstd > /dev/null 2>&1 || brew install zstd

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-macos-arm64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/GTestSetup.cmake') }}

      # Configure + build so compile_commands.json and the generated headers
      # exist (clang-tidy needs them to parse the TUs).  The full build, so
      # every translation unit of the compiler is checked, and the affected
      # test suites' sources with it.
      - name: Configure (Debug, full)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug "${PAYKAN_TESTS_FLAG}"

      - name: Build
        run: cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: clang-format (check)
        run: python3 scripts/clang_format.py

      - name: pkfmt (check)
        run: python3 scripts/pkfmt.py

      - name: clang-tidy (bug-focused gate)
        run: python3 scripts/run_clang_tidy.py --build-dir build

  # ---------------------------------------------------------------------------
  # Debug build + full test suite (Apple Silicon)
  # ---------------------------------------------------------------------------
  build-test-macos:
    name: Debug | macOS ARM64
    runs-on: macos-14
    needs: changes
    env:
      PAYKAN_TESTS_FLAG: ${{ needs.changes.outputs.cmake-flag }}
    steps:
      - uses: actions/checkout@v4

      # The prebuilt LLVM links with zstd (cmake/LLVMSetup.cmake).
      - name: Install system dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew list zstd > /dev/null 2>&1 || brew install zstd

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-macos-arm64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (Debug, full)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug "${PAYKAN_TESTS_FLAG}"

      - name: Build
        run: cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Test
        if: needs.changes.outputs.tests != ''
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # AddressSanitizer + LeakSanitizer build (Apple Silicon)
  # ---------------------------------------------------------------------------
  asan-macos:
    name: ASan+LSan | macOS ARM64
    runs-on: macos-14
    needs: changes
    env:
      PAYKAN_TESTS_FLAG: ${{ needs.changes.outputs.cmake-flag }}
    steps:
      - uses: actions/checkout@v4

      # The prebuilt LLVM links with zstd (cmake/LLVMSetup.cmake).
      - name: Install system dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew list zstd > /dev/null 2>&1 || brew install zstd

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build-asan/third-party
          # Keyed per build directory: the archive stores the path it was saved
          # from, so a key shared with the build/third-party jobs restores
          # nothing here and is never saved (the key already exists).
          key: third-party-macos-arm64-asan-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (ASan)
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug "${PAYKAN_TESTS_FLAG}" -DPAYKAN_ASAN=ON

      - name: Build
        run: cmake --build build-asan --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Test
        if: needs.changes.outputs.tests != ''
        env:
          # Apple clang has no LeakSanitizer on arm64 (see SanitizerSetup.cmake);
          # detect_leaks=1 would abort ASan at startup as unsupported.
          # detect_container_overflow=0: the prebuilt LLVM libraries are not
          # instrumented, so their std::vector growth does not update libc++'s
          # container annotations while our instrumented instantiations of the
          # same templates check them -- ASan then reports container-overflow
          # inside LLVM's own static initialisers (DebugCounter::addCounter) at
          # process start.  See AddressSanitizerContainerOverflow on the wiki.
          # allocator_may_return_null: the runtime reports an allocation that
          # fails (ENOMEM, memory::Buffer's OutOfMemory, a read's) instead of
          # aborting, and the tests exercise that with sizes no allocator can
          # serve; ASan's allocator is to return null for them, as libc's does,
          # not to report them as errors.
          # allow_user_poisoning=0: LLVM's BumpPtrAllocator poisons a new slab
          # and unpoisons each allocation from it, but only where it is
          # compiled with ASan: a slab our instrumented code starts (its
          # StartNewSlab) and the uninstrumented MLIR library allocates from
          # stays poisoned, and ASan reports use-after-poison in
          # MLIRContext's constructor (BuiltinDialect's types).  Only LLVM
          # poisons memory by hand; every other check stays on.
          ASAN_OPTIONS: abort_on_error=1:detect_stack_use_after_return=1:detect_container_overflow=0:allocator_may_return_null=1:allow_user_poisoning=0
        run: ctest --test-dir build-asan --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # UndefinedBehaviorSanitizer build (Apple Silicon)
  # ---------------------------------------------------------------------------
  ubsan-macos:
    name: UBSan | macOS ARM64
    runs-on: macos-14
    needs: changes
    env:
      PAYKAN_TESTS_FLAG: ${{ needs.changes.outputs.cmake-flag }}
    steps:
      - uses: actions/checkout@v4

      # The prebuilt LLVM links with zstd (cmake/LLVMSetup.cmake).
      - name: Install system dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew list zstd > /dev/null 2>&1 || brew install zstd

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build-ubsan/third-party
          # Keyed per build directory: the archive stores the path it was saved
          # from, so a key shared with the build/third-party jobs restores
          # nothing here and is never saved (the key already exists).
          key: third-party-macos-arm64-ubsan-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (UBSan)
        run: cmake -B build-ubsan -DCMAKE_BUILD_TYPE=Debug "${PAYKAN_TESTS_FLAG}" -DPAYKAN_UBSAN=ON

      - name: Build
        run: cmake --build build-ubsan --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Test
        if: needs.changes.outputs.tests != ''
        env:
          UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1
        run: ctest --test-dir build-ubsan --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # Debug build + full test suite (Linux x86-64)
  # ---------------------------------------------------------------------------
  build-test-linux:
    name: Debug | Linux x86-64
    runs-on: ubuntu-latest
    needs: changes
    env:
      PAYKAN_TESTS_FLAG: ${{ needs.changes.outputs.cmake-flag }}
    steps:
      - uses: actions/checkout@v4

      # libzstd-dev: the prebuilt LLVM links with zstd (cmake/LLVMSetup.cmake).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libzstd-dev

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-linux-x86_64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (Debug, full)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -G Ninja "${PAYKAN_TESTS_FLAG}"

      - name: Build
        run: cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Test
        if: needs.changes.outputs.tests != ''
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # Release build + full test suite (Linux x86-64, the default GCC).  GCC's
  # -O2/-O3 warnings (-Wmaybe-uninitialized, -Wdangling-pointer, ...) only
  # fire with optimisation on, so the Debug jobs cannot catch what would break
  # release.yml under -Werror.  release.yml ships this configuration, without
  # the tests.
  # ---------------------------------------------------------------------------
  release-linux:
    name: Release | Linux x86-64 (GCC)
    runs-on: ubuntu-latest
    needs: changes
    env:
      PAYKAN_TESTS_FLAG: ${{ needs.changes.outputs.cmake-flag }}
    steps:
      - uses: actions/checkout@v4

      # libzstd-dev: the prebuilt LLVM links with zstd (cmake/LLVMSetup.cmake).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libzstd-dev

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-linux-x86_64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (Release, full)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja "${PAYKAN_TESTS_FLAG}"

      - name: Build
        run: cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Test
        if: needs.changes.outputs.tests != ''
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # Code coverage (LLVM source-based) + floor gate.
  # Builds an instrumented tree with the vendored clang, runs the suite, and
  # fails if total first-party line coverage drops below the floor.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage | macOS ARM64
    runs-on: macos-14
    needs: changes
    # The coverage floor is over the whole suite: every suite or none.
    if: needs.changes.outputs.tests != ''
    steps:
      - uses: actions/checkout@v4

      # The prebuilt LLVM links with zstd (cmake/LLVMSetup.cmake).
      - name: Install system dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew list zstd > /dev/null 2>&1 || brew install zstd

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-macos-arm64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/GTestSetup.cmake') }}

      # A full configure populates build/third-party (vendored LLVM + GTest),
      # which the coverage tree below reuses for its LLVM, its clang and its
      # gtest source.
      - name: Configure base tree (provisions vendored toolchain)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPAYKAN_BUILD_ALL_TESTS=ON

      - name: Configure coverage tree
        run: |
          LLVM="$PWD/build/third-party/llvm"
          cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug -DPAYKAN_BUILD_ALL_TESTS=ON -DPAYKAN_COVERAGE=ON \
            -DLLVM_DIR="$LLVM/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER="$LLVM/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM/bin/clang++" \
            -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST="$PWD/build/third-party/gtest"

      - name: Build coverage tree
        run: cmake --build build-cov --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Report coverage + enforce floor
        run: python3 scripts/coverage.py --build-dir build-cov

      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: build-cov/coverage/coverage.lcov
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The packager's build and the installed paykan (#77, #123, #141): a plain
  # configure (tests are off by default) downloads nothing but LLVM, not even
  # GoogleTest, and builds the core: the recursive-descent frontend and the
  # mlir backend.  Installed, its paykan runs and builds programs, and the
  # example backend and frontend plugins build against the installed package
  # alone and load into it.
  # ---------------------------------------------------------------------------
  install-linux:
    name: Install | Linux x86-64
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4

      # libzstd-dev: the prebuilt LLVM links with zstd (cmake/LLVMSetup.cmake).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libzstd-dev

      # Restored, never saved: the cache is the test jobs', GoogleTest in it.
      - name: Restore the third-party dependencies
        uses: actions/cache/restore@v4
        with:
          path: build/third-party
          key: third-party-linux-x86_64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/GTestSetup.cmake') }}

      # The build directory the cache restores LLVM into, so the configure
      # downloads it only on a cache miss; GoogleTest, which the cache may
      # hold too, is moved out of the way, so a configure that fetched or
      # used it would show.
      - name: Configure and build with the defaults (tests off)
        run: |
          set -o pipefail
          rm -rf build/third-party/gtest
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug 2>&1 | tee configure.log
          grep -F "Frontends: recursive-descent (default: recursive-descent)" configure.log
          grep -F "Backends: mlir (default: mlir)" configure.log
          # (`! grep` mid-script would not fail the step: bash -e ignores a
          # negated command, actionlint/shellcheck SC2251.)
          if grep -i "Fetching\|GTest\|googletest" configure.log; then
            echo "error: the configure with tests off fetched GoogleTest (above)"
            exit 1
          fi
          if [ "$(ls build/third-party)" != "llvm" ]; then
            echo "error: build/third-party holds more than LLVM"
            exit 1
          fi
          test ! -e build/_deps
          test ! -e build/CTestTestfile.cmake
          cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"
          build/bin/paykan --version
          build/bin/paykan --list-backends | tee backends.log
          test "$(cat backends.log)" = "$(grep '^mlir (default)' backends.log)"

      # Plugins load into the INSTALLED paykan with no rebuild (#141): the
      # example backend and frontend are built against the installation
      # alone, then loaded with --plugin, from $PAYKAN_PLUGIN_PATH and from
      # the installation's plugin directory, with PaykanLang's build tree
      # deleted and its source tree moved away.
      - name: Load the example plugins into the installed paykan
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/paykan-prefix"
          ex="$RUNNER_TEMP/examples"
          cmake --install build --prefix "$prefix"
          mkdir -p "$ex"
          cp -R src/Backends/PrintPIR "$ex/print-pir"
          cp -R src/Frontends/ASTText "$ex/ast-text-frontend"
          cp samples/codegen/01_literals.pkn "$ex/hello.pkn"
          for p in print-pir ast-text-frontend; do
            cmake -S "$ex/$p" -B "$ex/build-$p" -G Ninja -DCMAKE_PREFIX_PATH="$prefix"
            cmake --build "$ex/build-$p"
          done
          rm -rf build
          src="$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP"
          mv "$src" "$src.away"
          trap 'mv "$src.away" "$src"' EXIT
          paykan="$prefix/bin/paykan"
          pp="$ex/build-print-pir/libpaykan_backend_print_pir.so"
          "$paykan" --emit-pir "$ex/hello.pkn" > driver.pir
          # 1. --plugin=<file>
          "$paykan" --no-plugins --plugin="$pp" --list-backends | tee backends.log
          grep -Fx "print-pir: prints the Paykan IR [$pp]" backends.log
          "$paykan" --no-plugins --plugin="$pp" --backend=print-pir \
            --emit-source "$ex/hello.pkn" | diff driver.pir -
          # 2. $PAYKAN_PLUGIN_PATH
          PAYKAN_PLUGIN_PATH="$ex/build-print-pir" "$paykan" --backend=print-pir \
            --emit-source "$ex/hello.pkn" | diff driver.pir -
          # 3. installed into the plugin directory, the plugin builds gone
          for p in print-pir ast-text-frontend; do
            cmake --install "$ex/build-$p"
            rm -rf "$ex/build-$p"
          done
          ls "$prefix"/lib/paykan/plugins/*/
          "$paykan" --version
          "$paykan" --backend=print-pir --emit-source "$ex/hello.pkn" | diff driver.pir -
          # A program given as an AST, through the frontend plugin.
          mkdir -p "$ex/ast"
          "$paykan" --emit-ast "$ex/hello.pkn" > "$ex/ast/hello.pkn"
          "$paykan" --frontend=ast-text --emit-pir "$ex/ast/hello.pkn" | diff driver.pir -
          if "$paykan" --no-plugins --list-backends | grep print-pir; then
            echo "error: --no-plugins still loads the installed plugins"
            exit 1
          fi
          # The installed paykan still finds its runtime (#124).
          "$paykan" run "$ex/hello.pkn" > run.out
          "$paykan" build -o prog "$ex/hello.pkn"
          ./prog | diff run.out -

  # ---------------------------------------------------------------------------
  # Strict C11: --emit-c's output for the whole samples corpus compiles
  # with -std=c11 -pedantic-errors -Wall -Wextra -Werror on GCC and on Clang
  # (both required here) and runs like `paykan run` (scripts/c_strict.py; the
  # CStrictC11 ctest runs it with whichever compilers a job has).
  # ---------------------------------------------------------------------------
  strict-c11-linux:
    name: Strict C11 | Linux x86-64 (GCC + Clang)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tests == 'all' || contains(needs.changes.outputs.tests, 'c-strict')
    steps:
      - uses: actions/checkout@v4

      # libzstd-dev: the prebuilt LLVM links with zstd (cmake/LLVMSetup.cmake).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc clang libzstd-dev

      # Restored, never saved: the cache is the test jobs', GoogleTest in it.
      - name: Restore the third-party dependencies
        uses: actions/cache/restore@v4
        with:
          path: build/third-party
          key: third-party-linux-x86_64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (the defaults)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      # The samples import the standard library (::io at least), so stage it.
      - name: Build
        run: cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)" --target paykan paykan_stdlib

      - name: Strict C11 on GCC and Clang
        run: |
          gcc --version && clang --version
          python3 scripts/c_strict.py --paykan build/bin/paykan \
            --cc gcc --cc clang -v
