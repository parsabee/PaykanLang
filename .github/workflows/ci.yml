name: CI

on:
  push:
    branches: [main, develop]
  # Every pull request, whatever its base: stacked PRs (based on another
  # PR's branch) need CI too.
  pull_request:
  # Manual runs on any branch (Actions tab -> CI -> "Run workflow").
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Code quality gate: clang-format (check) + clang-tidy (bug-focused).
  # Uses the vendored LLVM 17 toolchain so the gate matches local runs exactly.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint | clang-format + clang-tidy
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-macos-arm64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      # Configure + build so compile_commands.json and generated Parser/Lexer
      # headers exist (clang-tidy needs them to parse the TUs).
      - name: Configure (Debug)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: clang-format (check)
        run: python3 scripts/clang_format.py

      - name: clang-tidy (bug-focused gate)
        run: python3 scripts/run_clang_tidy.py --build-dir build

  # ---------------------------------------------------------------------------
  # Debug build + full test suite (Apple Silicon)
  # ---------------------------------------------------------------------------
  build-test-macos:
    name: Debug | macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-macos-arm64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (Debug)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # AddressSanitizer + LeakSanitizer build (Apple Silicon)
  # ---------------------------------------------------------------------------
  asan-macos:
    name: ASan+LSan | macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build-asan/third-party
          # Keyed per build directory: the archive stores the path it was saved
          # from, so a key shared with the build/third-party jobs restores
          # nothing here and is never saved (the key already exists).
          key: third-party-macos-arm64-asan-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (ASan)
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DPAYKAN_ASAN=ON

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test
        env:
          # Apple clang has no LeakSanitizer on arm64 (see SanitizerSetup.cmake);
          # detect_leaks=1 would abort ASan at startup as unsupported.
          # detect_container_overflow=0: the prebuilt LLVM libraries are not
          # instrumented, so their std::vector growth does not update libc++'s
          # container annotations while our instrumented instantiations of the
          # same templates check them -- ASan then reports container-overflow
          # inside LLVM's own static initialisers (DebugCounter::addCounter) at
          # process start.  See AddressSanitizerContainerOverflow on the wiki.
          ASAN_OPTIONS: abort_on_error=1:detect_stack_use_after_return=1:detect_container_overflow=0
        run: ctest --test-dir build-asan --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # UndefinedBehaviorSanitizer build (Apple Silicon)
  # ---------------------------------------------------------------------------
  ubsan-macos:
    name: UBSan | macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build-ubsan/third-party
          # Keyed per build directory: the archive stores the path it was saved
          # from, so a key shared with the build/third-party jobs restores
          # nothing here and is never saved (the key already exists).
          key: third-party-macos-arm64-ubsan-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (UBSan)
        run: cmake -B build-ubsan -DCMAKE_BUILD_TYPE=Debug -DPAYKAN_UBSAN=ON

      - name: Build
        run: cmake --build build-ubsan --parallel

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1
        run: ctest --test-dir build-ubsan --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # Debug build + full test suite (Linux x86-64)
  # ---------------------------------------------------------------------------
  build-test-linux:
    name: Debug | Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-linux-x86_64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (Debug)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # Release build + full test suite (Linux x86-64, the default GCC).  GCC's
  # -O2/-O3 warnings (-Wmaybe-uninitialized, -Wdangling-pointer, ...) only
  # fire with optimisation on, so the Debug jobs cannot catch what would break
  # release.yml under -Werror.  The barebones configuration is built in
  # Release too: its different inlining has surfaced warnings of its own.
  # ---------------------------------------------------------------------------
  release-linux:
    name: Release | Linux x86-64 (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-linux-x86_64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (Release, as release.yml)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Build barebones configuration (Release)
        run: |
          cmake -B build-bare -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPAYKAN_FRONTENDS=recursive-descent -DPAYKAN_BACKENDS=c \
            -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST="$PWD/build/third-party/gtest"
          cmake --build build-bare --parallel

  # ---------------------------------------------------------------------------
  # Code coverage (LLVM source-based) + floor gate.
  # Builds an instrumented tree with the vendored clang, runs the suite, and
  # fails if total first-party line coverage drops below the floor.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage | macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-macos-arm64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      # A plain configure populates build/third-party (vendored LLVM + GTest),
      # which the coverage tree below reuses for its clang and gtest source.
      - name: Configure base tree (provisions vendored toolchain)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Configure coverage tree
        run: |
          LLVM="$PWD/build/third-party/llvm"
          cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug -DPAYKAN_COVERAGE=ON \
            -DCMAKE_C_COMPILER="$LLVM/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM/bin/clang++" \
            -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST="$PWD/build/third-party/gtest"

      - name: Build coverage tree
        run: cmake --build build-cov --parallel

      - name: Report coverage + enforce floor
        run: python3 scripts/coverage.py --build-dir build-cov

      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: build-cov/coverage/coverage.lcov
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Barebones build: standard C++ only.  No LLVM, no Bison/Flex, no m4, and
  # nothing downloaded at configure time.  Proves the acceptance criteria of
  # #16 and #77: with -DPAYKAN_BUILD_TESTS=OFF configure downloads nothing at
  # all (GoogleTest is fetched only for the test suite), `paykan` links no
  # third-party library, the full suite passes on the C backend, and an
  # out-of-tree backend builds against the installed package.
  # ---------------------------------------------------------------------------
  barebones-linux:
    name: Barebones | Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (and remove the optional ones)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          sudo apt-get remove -y bison flex m4 || true
          ! command -v bison && ! command -v flex && ! command -v m4

      # The packager's build (#77): tests off, so not even GoogleTest is fetched.
      - name: Configure and build with tests off (nothing downloaded)
        run: |
          set -o pipefail
          cmake -B build-notests -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DPAYKAN_FRONTENDS=recursive-descent -DPAYKAN_BACKENDS=c \
            -DPAYKAN_BUILD_TESTS=OFF 2>&1 | tee configure-notests.log
          ! grep -i "Downloading\|Fetching\|GTest\|Building Bison\|Building Flex" configure-notests.log
          test ! -e build-notests/third-party
          test ! -e build-notests/_deps
          test ! -e build-notests/CTestTestfile.cmake
          cmake --build build-notests --parallel
          build-notests/bin/paykan --version

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/third-party/gtest
          key: gtest-${{ hashFiles('cmake/GTestSetup.cmake') }}

      - name: Configure (recursive-descent frontend, C backend only)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DPAYKAN_FRONTENDS=recursive-descent -DPAYKAN_BACKENDS=c \
            2>&1 | tee configure.log
          # Nothing but GoogleTest may be fetched.
          ! grep -i "Downloading\|Building Bison\|Building Flex" configure.log
          test "$(ls build/third-party)" = "gtest"

      - name: Build
        run: cmake --build build --parallel

      - name: Check that paykan links no third-party library
        run: |
          ldd build/bin/paykan | tee ldd.log
          ! grep -iv "linux-vdso\|libstdc++\|libgcc_s\|libc\.so\|libm\.so\|ld-linux" ldd.log
          ! nm -C build/bin/paykan | grep -q "llvm::\|yy::\|yylex"

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Install and build the out-of-tree example backend against it
        run: |
          cmake --install build --prefix "$PWD/install"
          cmake -S utils/print-pir -B build-example -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-example
          build-example/paykan-print-pir --list-backends | grep print-pir
          build-example/paykan-print-pir --backend=print-pir --emit-source \
            samples/codegen/01_literals.pkn > example.pir
          build/bin/paykan --emit-pir samples/codegen/01_literals.pkn > driver.pir
          diff example.pir driver.pir

  # ---------------------------------------------------------------------------
  # Strict C11: the C backend's output for the whole samples corpus compiles
  # with -std=c11 -pedantic-errors -Wall -Wextra -Werror on GCC and on Clang
  # (both required here) and runs like `paykan run` (scripts/c_strict.py; the
  # CStrictC11 ctest runs it with whichever compilers a job has).
  # ---------------------------------------------------------------------------
  strict-c11-linux:
    name: Strict C11 | Linux x86-64 (GCC + Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc clang

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/third-party/gtest
          key: gtest-${{ hashFiles('cmake/GTestSetup.cmake') }}

      - name: "Configure (core: recursive-descent frontend, C backend)"
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DPAYKAN_FRONTENDS=recursive-descent -DPAYKAN_BACKENDS=c

      - name: Build
        run: cmake --build build --parallel --target paykan

      - name: Strict C11 on GCC and Clang
        run: |
          gcc --version && clang --version
          python3 scripts/c_strict.py --paykan build/bin/paykan \
            --cc gcc --cc clang --build-cc gcc --build-cc clang -v

  # ---------------------------------------------------------------------------
  # Frontend differential: both frontends built, every sample and test input
  # parsed by each and compared (in process and through the driver).
  # ---------------------------------------------------------------------------
  frontend-differential-linux:
    name: Frontend differential | Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-linux-x86_64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (both frontends)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            "-DPAYKAN_FRONTENDS=recursive-descent;bison"

      - name: Build
        run: cmake --build build --parallel

      - name: Differential and frontend tests
        run: ctest --test-dir build --output-on-failure --parallel 4 -R "Frontend|Parser|Sema"
