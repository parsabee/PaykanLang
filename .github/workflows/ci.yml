name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # Code quality gate: clang-format (check) + clang-tidy (bug-focused).
  # Uses the vendored LLVM 17 toolchain so the gate matches local runs exactly.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint | clang-format + clang-tidy
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-macos-arm64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      # Configure + build so compile_commands.json and generated Parser/Lexer
      # headers exist (clang-tidy needs them to parse the TUs).
      - name: Configure (Debug)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: clang-format (check)
        run: python3 scripts/clang_format.py

      - name: clang-tidy (bug-focused gate)
        run: python3 scripts/run_clang_tidy.py --build-dir build

  # ---------------------------------------------------------------------------
  # Debug build + full test suite (Apple Silicon)
  # ---------------------------------------------------------------------------
  build-test-macos:
    name: Debug | macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-macos-arm64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (Debug)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # AddressSanitizer + LeakSanitizer build (Apple Silicon)
  # ---------------------------------------------------------------------------
  asan-macos:
    name: ASan+LSan | macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build-asan/third-party
          key: third-party-macos-arm64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (ASan)
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DPAYKAN_ASAN=ON

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test
        env:
          # Apple clang has no LeakSanitizer on arm64 (see SanitizerSetup.cmake);
          # detect_leaks=1 would abort ASan at startup as unsupported.
          ASAN_OPTIONS: abort_on_error=1:detect_stack_use_after_return=1
        run: ctest --test-dir build-asan --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # UndefinedBehaviorSanitizer build (Apple Silicon)
  # ---------------------------------------------------------------------------
  ubsan-macos:
    name: UBSan | macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build-ubsan/third-party
          key: third-party-macos-arm64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (UBSan)
        run: cmake -B build-ubsan -DCMAKE_BUILD_TYPE=Debug -DPAYKAN_UBSAN=ON

      - name: Build
        run: cmake --build build-ubsan --parallel

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1
        run: ctest --test-dir build-ubsan --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # Debug build + full test suite (Linux x86-64)
  # ---------------------------------------------------------------------------
  build-test-linux:
    name: Debug | Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-linux-x86_64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      - name: Configure (Debug)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # Code coverage (LLVM source-based) + floor gate.
  # Builds an instrumented tree with the vendored clang, runs the suite, and
  # fails if total first-party line coverage drops below the floor.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage | macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: build/third-party
          key: third-party-macos-arm64-${{ hashFiles('cmake/LLVMSetup.cmake', 'cmake/BisonFlexSetup.cmake', 'cmake/GTestSetup.cmake') }}

      # A plain configure populates build/third-party (vendored LLVM + GTest),
      # which the coverage tree below reuses for its clang and gtest source.
      - name: Configure base tree (provisions vendored toolchain)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Configure coverage tree
        run: |
          LLVM="$PWD/build/third-party/llvm"
          cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug -DPAYKAN_COVERAGE=ON \
            -DCMAKE_C_COMPILER="$LLVM/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM/bin/clang++" \
            -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST="$PWD/build/third-party/gtest"

      - name: Build coverage tree
        run: cmake --build build-cov --parallel

      - name: Report coverage + enforce floor
        run: python3 scripts/coverage.py --build-dir build-cov

      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: build-cov/coverage/coverage.lcov
          if-no-files-found: warn
